<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - SmartStock</title>

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Font Awesome 6 -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />
    <!-- Google Fonts Inter -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- App Stylesheets -->
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <!-- App Layout -->
    <div class="app-layout">
      <!-- Sidebar injected by app.js -->
      <aside id="sidebar" class="sidebar"></aside>

      <!-- Overlay for mobile -->
      <div
        id="sidebarOverlay"
        class="sidebar-overlay"
        onclick="closeSidebar()"
      ></div>

      <div class="main-content">
        <!-- Navbar injected by app.js -->
        <nav id="topNavbar" class="top-navbar"></nav>

        <div class="page-content">
          <!-- Dashboard Header -->
          <div class="page-header">
            <div
              style="
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
                flex-wrap: wrap;
                gap: 1rem;
              "
            >
              <div>
                <h1 class="dashboard-greeting" id="greetingText">
                  Good morning
                </h1>
                <p class="dashboard-date" id="dashboardDate"></p>
              </div>
              <button class="btn-primary" onclick="exportDashboardReport()">
                <i class="fas fa-download me-2"></i>Export Report
              </button>
            </div>
          </div>

          <!-- KPI Cards Row -->
          <div class="kpi-grid" id="kpiGrid">
            <!-- Injected by dashboard.js -->
          </div>

          <!-- Charts Row 1 -->
          <div class="charts-grid" style="margin-top: 1.5rem">
            <!-- Inventory Health -->
            <div class="card">
              <div class="card-header">
                <h5 class="card-title">Inventory Health</h5>
                <span class="badge badge-info">Live</span>
              </div>
              <div class="card-body">
                <div
                  style="
                    display: flex;
                    gap: 1.5rem;
                    align-items: center;
                    flex-wrap: wrap;
                  "
                >
                  <div
                    class="chart-wrapper"
                    style="width: 200px; height: 200px; flex-shrink: 0"
                  >
                    <canvas id="healthChart"></canvas>
                  </div>
                  <div class="health-legend" id="healthLegend"></div>
                </div>
              </div>
            </div>

            <!-- Inventory Value Chart -->
            <div class="card">
              <div class="card-header">
                <h5 class="card-title">Inventory Value (Monthly)</h5>
                <select
                  id="valueChartPeriod"
                  class="filter-select"
                  style="font-size: 0.8rem"
                  onchange="renderValueChart()"
                >
                  <option>Last 7 months</option>
                  <option>Last 12 months</option>
                </select>
              </div>
              <div class="card-body">
                <div class="chart-wrapper" style="height: 200px">
                  <canvas id="valueChart"></canvas>
                </div>
              </div>
            </div>
          </div>

          <!-- Charts Row 2 -->
          <div class="charts-grid" style="margin-top: 1rem">
            <!-- Category Distribution -->
            <div class="card">
              <div class="card-header">
                <h5 class="card-title">Products by Category</h5>
              </div>
              <div class="card-body">
                <div class="chart-wrapper" style="height: 220px">
                  <canvas id="categoryChart"></canvas>
                </div>
              </div>
            </div>

            <!-- Inventory Alerts -->
            <div class="card">
              <div class="card-header">
                <h5 class="card-title">Inventory Alerts</h5>
                <span id="alertCount" class="badge badge-danger"></span>
              </div>
              <div
                class="card-body"
                id="alertsList"
                style="max-height: 280px; overflow-y: auto"
              >
                <!-- Injected by dashboard.js -->
              </div>
            </div>
          </div>

          <!-- Quick Actions -->
          <div class="card" style="margin-top: 1rem">
            <div class="card-header">
              <h5 class="card-title">Quick Actions</h5>
            </div>
            <div class="card-body">
              <div class="quick-actions">
                <button
                  class="quick-action-btn btn-primary"
                  onclick="openAddProductModal()"
                >
                  <i class="fas fa-plus"></i> Add Product
                </button>
                <button
                  class="quick-action-btn"
                  style="
                    background: #f1f5f9;
                    color: #475569;
                    border: none;
                    padding: 10px 20px;
                    border-radius: 10px;
                    font-weight: 500;
                    cursor: pointer;
                    display: flex;
                    align-items: center;
                    gap: 8px;
                  "
                  onclick="window.location.href='suppliers.html'"
                >
                  <i class="fas fa-truck"></i> Add Supplier
                </button>
                <button
                  class="quick-action-btn"
                  style="
                    background: #f1f5f9;
                    color: #475569;
                    border: none;
                    padding: 10px 20px;
                    border-radius: 10px;
                    font-weight: 500;
                    cursor: pointer;
                    display: flex;
                    align-items: center;
                    gap: 8px;
                  "
                  onclick="window.location.href='purchase-orders.html'"
                >
                  <i class="fas fa-file-invoice"></i> Create Purchase Order
                </button>
                <button
                  class="quick-action-btn"
                  style="
                    background: #f1f5f9;
                    color: #475569;
                    border: none;
                    padding: 10px 20px;
                    border-radius: 10px;
                    font-weight: 500;
                    cursor: pointer;
                    display: flex;
                    align-items: center;
                    gap: 8px;
                  "
                  onclick="window.location.href='reports.html'"
                >
                  <i class="fas fa-chart-bar"></i> View Reports
                </button>
              </div>
            </div>
          </div>

          <!-- Recent Products -->
          <div class="card" style="margin-top: 1rem">
            <div class="card-header">
              <h5 class="card-title">Recent Products</h5>
              <a
                href="products.html"
                style="
                  font-size: 0.875rem;
                  color: #4f46e5;
                  text-decoration: none;
                "
                >View all <i class="fas fa-arrow-right"></i
              ></a>
            </div>
            <div class="card-body" style="padding: 0">
              <div
                class="table-container"
                style="border: none; border-radius: 0"
              >
                <table style="width: 100%; border-collapse: collapse">
                  <thead>
                    <tr>
                      <th>Product</th>
                      <th>SKU</th>
                      <th>Category</th>
                      <th>Price</th>
                      <th>Quantity</th>
                      <th>Status</th>
                      <th>Warehouse</th>
                    </tr>
                  </thead>
                  <tbody id="recentProductsBody">
                    <!-- Injected by dashboard.js -->
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
        <!-- /page-content -->
      </div>
      <!-- /main-content -->
    </div>
    <!-- /app-layout -->

    <!-- ============================================================ -->
    <!-- Add Product Modal                                             -->
    <!-- ============================================================ -->
    <div id="addProductModal" class="modal-overlay" style="display: none">
      <div class="modal">
        <div class="modal-header">
          <h5>Add New Product</h5>
          <button
            onclick="closeAddProductModal()"
            style="
              background: none;
              border: none;
              font-size: 1.2rem;
              cursor: pointer;
              color: #64748b;
            "
          >
            <i class="fas fa-times"></i>
          </button>
        </div>
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-md-6">
              <div class="form-group">
                <label class="form-label">Product Name *</label>
                <input
                  type="text"
                  id="dp_name"
                  class="form-control"
                  placeholder="Enter product name"
                />
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group">
                <label class="form-label">SKU *</label>
                <input
                  type="text"
                  id="dp_sku"
                  class="form-control"
                  placeholder="e.g. PRD-001"
                />
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group">
                <label class="form-label">Category *</label>
                <select id="dp_category" class="form-select">
                  <option value="">Select category</option>
                  <option>Electronics</option>
                  <option>Grocery</option>
                  <option>Clothing</option>
                  <option>Stationery</option>
                  <option>Home</option>
                  <option>Other</option>
                </select>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group">
                <label class="form-label">Price (₹) *</label>
                <input
                  type="number"
                  id="dp_price"
                  class="form-control"
                  placeholder="0.00"
                  min="0"
                  step="0.01"
                />
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group">
                <label class="form-label">Quantity *</label>
                <input
                  type="number"
                  id="dp_quantity"
                  class="form-control"
                  placeholder="0"
                  min="0"
                />
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group">
                <label class="form-label">Min Stock *</label>
                <input
                  type="number"
                  id="dp_minStock"
                  class="form-control"
                  placeholder="10"
                  min="0"
                />
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group">
                <label class="form-label">Supplier</label>
                <select id="dp_supplier" class="form-select">
                  <option value="">Select supplier</option>
                </select>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group">
                <label class="form-label">Warehouse</label>
                <select id="dp_warehouse" class="form-select">
                  <option value="">Select warehouse</option>
                </select>
              </div>
            </div>
            <div class="col-12">
              <div class="form-group">
                <label class="form-label">Description</label>
                <textarea
                  id="dp_description"
                  class="form-control"
                  rows="2"
                  placeholder="Product description..."
                ></textarea>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button
            class="btn-secondary"
            onclick="closeAddProductModal()"
            style="
              padding: 8px 16px;
              border-radius: 8px;
              border: none;
              cursor: pointer;
              background: #f1f5f9;
              color: #475569;
              font-weight: 500;
            "
          >
            Cancel
          </button>
          <button
            class="btn-primary"
            onclick="saveProductFromDashboard()"
            style="
              padding: 8px 16px;
              border-radius: 8px;
              border: none;
              cursor: pointer;
              font-weight: 500;
            "
          >
            Add Product
          </button>
        </div>
      </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Scripts -->
    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <!-- App Scripts -->
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/dashboard.js"></script>
  </body>
</html>
