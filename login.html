<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - SmartStock</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body class="auth-page">
    <div class="auth-card">
      <!-- Logo -->
      <div class="auth-logo">
        <div class="logo-icon"><i class="fas fa-boxes-stacked"></i></div>
        <h1>SmartStock</h1>
        <p>Sign in to your account</p>
      </div>

      <!-- Alert Box -->
      <div
        id="alertBox"
        class="alert mb-3"
        style="display: none"
        role="alert"
      ></div>

      <!-- Login Form -->
      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="loginEmail">Email Address</label>
          <input
            type="email"
            id="loginEmail"
            class="form-control"
            placeholder="Enter your email"
            required
            autocomplete="email"
          />
          <div class="invalid-feedback" id="emailError"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="loginPassword">Password</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="loginPassword"
              class="form-control"
              placeholder="Enter your password"
              required
              autocomplete="current-password"
            />
            <button
              type="button"
              class="show-password-btn"
              id="togglePassword"
              title="Show/hide password"
            >
              <i class="fas fa-eye"></i>
            </button>
          </div>
          <div class="invalid-feedback" id="passwordError"></div>
        </div>

        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
          "
        >
          <label
            class="form-check"
            style="
              display: flex;
              gap: 8px;
              align-items: center;
              cursor: pointer;
              margin: 0;
            "
          >
            <input
              type="checkbox"
              id="rememberMe"
              style="accent-color: #4f46e5"
            />
            <span style="font-size: 0.875rem; color: #64748b">Remember me</span>
          </label>
          <a
            href="forgot-password.html"
            style="
              font-size: 0.875rem;
              color: #4f46e5;
              text-decoration: none;
              font-weight: 500;
            "
            >Forgot password?</a
          >
        </div>

        <button type="submit" class="btn-auth-primary" id="submitBtn">
          <span id="submitText">Sign In</span>
          <span id="submitSpinner" style="display: none"
            ><i class="fas fa-spinner fa-spin"></i> Signing in...</span
          >
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="register.html">Create account</a>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script>
      (function () {
        // ── Redirect if already logged in ──────────────────────────────────────
        const session =
          (window.StorageManager
            ? StorageManager.getItem("smartstock_session")
            : null) ||
          JSON.parse(localStorage.getItem("smartstock_current_user") || "null");
        if (session && (session.userId || session.id)) {
          window.location.href = "dashboard.html";
          return;
        }

        // ── Handle ?registered=true query param ───────────────────────────────
        const params = new URLSearchParams(window.location.search);
        const alertBox = document.getElementById("alertBox");

        function showAlert(message, type) {
          alertBox.className = "alert mb-3 alert-" + type;
          alertBox.innerHTML = message;
          alertBox.style.display = "block";
        }

        if (params.get("registered") === "true") {
          showAlert(
            '<i class="fas fa-check-circle me-2"></i>Account created successfully! Please sign in.',
            "success",
          );
        }
        if (params.get("logout") === "true") {
          showAlert(
            '<i class="fas fa-sign-out-alt me-2"></i>You have been signed out successfully.',
            "info",
          );
        }
        if (params.get("expired") === "true") {
          showAlert(
            '<i class="fas fa-clock me-2"></i>Your session has expired. Please sign in again.',
            "warning",
          );
        }

        // ── Remember Me – pre-fill email ──────────────────────────────────────
        const rememberedEmail = localStorage.getItem(
          "smartstock_remember_email",
        );
        if (rememberedEmail) {
          document.getElementById("loginEmail").value = rememberedEmail;
          document.getElementById("rememberMe").checked = true;
        }

        // ── Toggle Password Visibility ─────────────────────────────────────────
        const toggleBtn = document.getElementById("togglePassword");
        const passwordInput = document.getElementById("loginPassword");
        toggleBtn.addEventListener("click", function () {
          const isPassword = passwordInput.type === "password";
          passwordInput.type = isPassword ? "text" : "password";
          toggleBtn.querySelector("i").className = isPassword
            ? "fas fa-eye-slash"
            : "fas fa-eye";
        });

        // ── Form Validation Helpers ───────────────────────────────────────────
        function setInvalid(inputId, errorId, message) {
          const el = document.getElementById(inputId);
          el.classList.add("is-invalid");
          el.classList.remove("is-valid");
          document.getElementById(errorId).textContent = message;
          return false;
        }

        function setValid(inputId) {
          const el = document.getElementById(inputId);
          el.classList.remove("is-invalid");
          el.classList.add("is-valid");
          return true;
        }

        function validateForm() {
          let valid = true;
          const email = document.getElementById("loginEmail").value.trim();
          const password = document.getElementById("loginPassword").value;

          if (!email) {
            valid =
              setInvalid(
                "loginEmail",
                "emailError",
                "Email address is required.",
              ) && valid;
          } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            valid =
              setInvalid(
                "loginEmail",
                "emailError",
                "Please enter a valid email address.",
              ) && valid;
          } else {
            setValid("loginEmail");
          }

          if (!password) {
            valid =
              setInvalid(
                "loginPassword",
                "passwordError",
                "Password is required.",
              ) && valid;
          } else {
            setValid("loginPassword");
          }

          return valid;
        }

        // ── Form Submit ───────────────────────────────────────────────────────
        document
          .getElementById("loginForm")
          .addEventListener("submit", function (e) {
            e.preventDefault();
            alertBox.style.display = "none";

            if (!validateForm()) return;

            const email = document.getElementById("loginEmail").value.trim();
            const password = document.getElementById("loginPassword").value;
            const remember = document.getElementById("rememberMe").checked;

            // Show loading state
            document.getElementById("submitText").style.display = "none";
            document.getElementById("submitSpinner").style.display = "inline";
            document.getElementById("submitBtn").disabled = true;

            // Simulate short async delay for UX
            setTimeout(function () {
              const result = Auth.login(email, password);

              if (result.success) {
                if (remember) {
                  localStorage.setItem("smartstock_remember_email", email);
                } else {
                  localStorage.removeItem("smartstock_remember_email");
                }
                showAlert(
                  '<i class="fas fa-check-circle me-2"></i>Login successful! Redirecting…',
                  "success",
                );
                setTimeout(function () {
                  window.location.href = "dashboard.html";
                }, 800);
              } else {
                document.getElementById("submitText").style.display = "inline";
                document.getElementById("submitSpinner").style.display = "none";
                document.getElementById("submitBtn").disabled = false;
                showAlert(
                  '<i class="fas fa-exclamation-circle me-2"></i>' +
                    result.message,
                  "danger",
                );
                document.getElementById("loginPassword").value = "";
                document
                  .getElementById("loginPassword")
                  .classList.remove("is-valid");
              }
            }, 600);
          });

        // ── Clear validation on input ─────────────────────────────────────────
        ["loginEmail", "loginPassword"].forEach(function (id) {
          document.getElementById(id).addEventListener("input", function () {
            this.classList.remove("is-invalid", "is-valid");
          });
        });
      })();
    </script>
  </body>
</html>
