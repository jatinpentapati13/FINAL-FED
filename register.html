<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account - SmartStock</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <style>
      .password-strength {
        margin-top: 6px;
      }
      .strength-bar {
        height: 4px;
        border-radius: 2px;
        background: #e2e8f0;
        overflow: hidden;
        margin-bottom: 4px;
      }
      .strength-bar-fill {
        height: 100%;
        border-radius: 2px;
        transition:
          width 0.3s,
          background 0.3s;
        width: 0%;
      }
      .strength-text {
        font-size: 0.75rem;
        font-weight: 500;
      }
      .strength-weak .strength-bar-fill {
        width: 33%;
        background: #ef4444;
      }
      .strength-medium .strength-bar-fill {
        width: 66%;
        background: #f59e0b;
      }
      .strength-strong .strength-bar-fill {
        width: 100%;
        background: #10b981;
      }
      .strength-weak .strength-text {
        color: #ef4444;
      }
      .strength-medium .strength-text {
        color: #f59e0b;
      }
      .strength-strong .strength-text {
        color: #10b981;
      }
      .phone-input-wrapper {
        display: flex;
      }
      .phone-prefix {
        background: #f1f5f9;
        border: 1.5px solid #e2e8f0;
        border-right: none;
        border-radius: 10px 0 0 10px;
        padding: 0 12px;
        display: flex;
        align-items: center;
        color: #64748b;
        font-size: 0.9rem;
        font-weight: 500;
        white-space: nowrap;
      }
      .phone-input-wrapper .form-control {
        border-radius: 0 10px 10px 0 !important;
      }
      .terms-check {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        cursor: pointer;
      }
      .terms-check input {
        margin-top: 3px;
        accent-color: #4f46e5;
        flex-shrink: 0;
      }
      .terms-check span {
        font-size: 0.875rem;
        color: #64748b;
        line-height: 1.5;
      }
      .terms-check a {
        color: #4f46e5;
        text-decoration: none;
        font-weight: 500;
      }
      .terms-check a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body class="auth-page">
    <div class="auth-card" style="max-width: 460px">
      <!-- Logo -->
      <div class="auth-logo">
        <div class="logo-icon"><i class="fas fa-boxes-stacked"></i></div>
        <h1>SmartStock</h1>
        <p>Create your account</p>
      </div>

      <!-- Alert Box -->
      <div
        id="alertBox"
        class="alert mb-3"
        style="display: none"
        role="alert"
      ></div>

      <!-- Register Form -->
      <form id="registerForm" novalidate>
        <!-- Full Name -->
        <div class="form-group">
          <label class="form-label" for="regName">Full Name</label>
          <div style="position: relative">
            <span
              style="
                position: absolute;
                left: 12px;
                top: 50%;
                transform: translateY(-50%);
                color: #94a3b8;
              "
              ><i class="fas fa-user"></i
            ></span>
            <input
              type="text"
              id="regName"
              class="form-control"
              placeholder="John Doe"
              style="padding-left: 36px"
              required
              autocomplete="name"
            />
          </div>
          <div class="invalid-feedback" id="nameError"></div>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label class="form-label" for="regEmail">Email Address</label>
          <div style="position: relative">
            <span
              style="
                position: absolute;
                left: 12px;
                top: 50%;
                transform: translateY(-50%);
                color: #94a3b8;
              "
              ><i class="fas fa-envelope"></i
            ></span>
            <input
              type="email"
              id="regEmail"
              class="form-control"
              placeholder="you@example.com"
              style="padding-left: 36px"
              required
              autocomplete="email"
            />
          </div>
          <div class="invalid-feedback" id="emailError"></div>
        </div>

        <!-- Phone -->
        <div class="form-group">
          <label class="form-label" for="regPhone">Phone Number</label>
          <div class="phone-input-wrapper">
            <div class="phone-prefix">
              <i
                class="fas fa-phone"
                style="margin-right: 6px; font-size: 0.8rem"
              ></i>
              +91
            </div>
            <input
              type="tel"
              id="regPhone"
              class="form-control"
              placeholder="9876543210"
              maxlength="10"
              autocomplete="tel"
            />
          </div>
          <div class="invalid-feedback" id="phoneError"></div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label class="form-label" for="regPassword">Password</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="regPassword"
              class="form-control"
              placeholder="Minimum 6 characters"
              required
              autocomplete="new-password"
            />
            <button
              type="button"
              class="show-password-btn"
              id="togglePassword"
              title="Show/hide password"
            >
              <i class="fas fa-eye"></i>
            </button>
          </div>
          <div
            class="password-strength"
            id="strengthIndicator"
            style="display: none"
          >
            <div class="strength-bar">
              <div class="strength-bar-fill" id="strengthBar"></div>
            </div>
            <span class="strength-text" id="strengthText"></span>
          </div>
          <div class="invalid-feedback" id="passwordError"></div>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label class="form-label" for="regConfirmPassword"
            >Confirm Password</label
          >
          <div class="password-wrapper">
            <input
              type="password"
              id="regConfirmPassword"
              class="form-control"
              placeholder="Re-enter your password"
              required
              autocomplete="new-password"
            />
            <button
              type="button"
              class="show-password-btn"
              id="toggleConfirmPassword"
              title="Show/hide password"
            >
              <i class="fas fa-eye"></i>
            </button>
          </div>
          <div class="invalid-feedback" id="confirmPasswordError"></div>
        </div>

        <!-- Terms -->
        <div class="form-group" style="margin-bottom: 1.5rem">
          <label class="terms-check">
            <input type="checkbox" id="regTerms" required />
            <span
              >I agree to the
              <a
                href="javascript:void(0)"
                onclick="alert('Terms of Service (SmartStock Demo):\n\nThis application is built for educational demonstration. Data is stored safely inside your browser LocalStorage.')"
                >Terms of Service</a
              >
              and
              <a
                href="javascript:void(0)"
                onclick="alert('Privacy Policy (SmartStock Demo):\n\nNo personal data is sent to external servers or third parties. All credentials and records persist strictly in your local browser.')"
                >Privacy Policy</a
              >. I understand this is a demo application.</span
            >
          </label>
          <div
            class="invalid-feedback"
            id="termsError"
            style="display: block; visibility: hidden"
          >
            Please accept the terms.
          </div>
        </div>

        <button type="submit" class="btn-auth-primary" id="submitBtn">
          <span id="submitText"
            ><i class="fas fa-user-plus me-2"></i>Create Account</span
          >
          <span id="submitSpinner" style="display: none"
            ><i class="fas fa-spinner fa-spin"></i> Creating account...</span
          >
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign in</a>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script>
      (function () {
        // Redirect if already logged in
        const session =
          (window.StorageManager
            ? StorageManager.getItem("smartstock_session")
            : null) ||
          JSON.parse(localStorage.getItem("smartstock_current_user") || "null");
        if (session && (session.userId || session.id)) {
          window.location.href = "dashboard.html";
          return;
        }

        const alertBox = document.getElementById("alertBox");

        function showAlert(message, type) {
          alertBox.className = "alert mb-3 alert-" + type;
          alertBox.innerHTML = message;
          alertBox.style.display = "block";
          alertBox.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }

        // ── Password Strength ─────────────────────────────────────────────────
        function checkPasswordStrength(password) {
          let score = 0;
          if (password.length >= 6) score++;
          if (password.length >= 10) score++;
          if (/[A-Z]/.test(password)) score++;
          if (/[0-9]/.test(password)) score++;
          if (/[^A-Za-z0-9]/.test(password)) score++;
          if (score <= 1) return "weak";
          if (score <= 3) return "medium";
          return "strong";
        }

        const passwordInput = document.getElementById("regPassword");
        const strengthIndicator = document.getElementById("strengthIndicator");
        const strengthText = document.getElementById("strengthText");

        passwordInput.addEventListener("input", function () {
          const val = this.value;
          if (!val) {
            strengthIndicator.style.display = "none";
            return;
          }
          strengthIndicator.style.display = "block";
          const level = checkPasswordStrength(val);
          strengthIndicator.className = "password-strength strength-" + level;
          const labels = {
            weak: "Weak password",
            medium: "Medium strength",
            strong: "Strong password",
          };
          strengthText.textContent = labels[level];
        });

        // ── Toggle Passwords ──────────────────────────────────────────────────
        function toggleVisibility(inputId, btnId) {
          const input = document.getElementById(inputId);
          const btn = document.getElementById(btnId);
          btn.addEventListener("click", function () {
            const isPassword = input.type === "password";
            input.type = isPassword ? "text" : "password";
            btn.querySelector("i").className = isPassword
              ? "fas fa-eye-slash"
              : "fas fa-eye";
          });
        }
        toggleVisibility("regPassword", "togglePassword");
        toggleVisibility("regConfirmPassword", "toggleConfirmPassword");

        // ── Validation Helpers ────────────────────────────────────────────────
        function setInvalid(inputId, errorId, message) {
          const el = document.getElementById(inputId);
          if (el) {
            el.classList.add("is-invalid");
            el.classList.remove("is-valid");
          }
          const errEl = document.getElementById(errorId);
          if (errEl) {
            errEl.textContent = message;
            errEl.style.visibility = "visible";
            errEl.style.display = "block";
          }
          return false;
        }

        function setValid(inputId, errorId) {
          const el = document.getElementById(inputId);
          if (el) {
            el.classList.remove("is-invalid");
            el.classList.add("is-valid");
          }
          const errEl = document.getElementById(errorId);
          if (errEl) {
            errEl.style.visibility = "hidden";
          }
          return true;
        }

        function validateForm() {
          let valid = true;
          const name = document.getElementById("regName").value.trim();
          const email = document.getElementById("regEmail").value.trim();
          const phone = document.getElementById("regPhone").value.trim();
          const pass = document.getElementById("regPassword").value;
          const confirm = document.getElementById("regConfirmPassword").value;
          const terms = document.getElementById("regTerms").checked;

          // Name
          if (!name || name.length < 2) {
            valid =
              setInvalid(
                "regName",
                "nameError",
                "Full name must be at least 2 characters.",
              ) && valid;
          } else {
            setValid("regName", "nameError");
          }

          // Email
          if (!email) {
            valid =
              setInvalid(
                "regEmail",
                "emailError",
                "Email address is required.",
              ) && valid;
          } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            valid =
              setInvalid(
                "regEmail",
                "emailError",
                "Please enter a valid email address.",
              ) && valid;
          } else {
            setValid("regEmail", "emailError");
          }

          // Phone (optional but validate if provided)
          if (phone && !/^[6-9]\d{9}$/.test(phone)) {
            valid =
              setInvalid(
                "regPhone",
                "phoneError",
                "Enter a valid 10-digit Indian mobile number.",
              ) && valid;
          } else {
            setValid("regPhone", "phoneError");
          }

          // Password
          if (!pass || pass.length < 6) {
            valid =
              setInvalid(
                "regPassword",
                "passwordError",
                "Password must be at least 6 characters.",
              ) && valid;
          } else {
            setValid("regPassword", "passwordError");
          }

          // Confirm Password
          if (!confirm) {
            valid =
              setInvalid(
                "regConfirmPassword",
                "confirmPasswordError",
                "Please confirm your password.",
              ) && valid;
          } else if (pass && confirm !== pass) {
            valid =
              setInvalid(
                "regConfirmPassword",
                "confirmPasswordError",
                "Passwords do not match.",
              ) && valid;
          } else {
            setValid("regConfirmPassword", "confirmPasswordError");
          }

          // Terms
          if (!terms) {
            document.getElementById("termsError").textContent =
              "You must accept the terms to continue.";
            document.getElementById("termsError").style.visibility = "visible";
            valid = false;
          } else {
            document.getElementById("termsError").style.visibility = "hidden";
          }

          return valid;
        }

        // ── Form Submit ───────────────────────────────────────────────────────
        document
          .getElementById("registerForm")
          .addEventListener("submit", function (e) {
            e.preventDefault();
            alertBox.style.display = "none";

            if (!validateForm()) return;

            const name = document.getElementById("regName").value.trim();
            const email = document.getElementById("regEmail").value.trim();
            const phone = document.getElementById("regPhone").value.trim();
            const pass = document.getElementById("regPassword").value;

            // Show loading
            document.getElementById("submitText").style.display = "none";
            document.getElementById("submitSpinner").style.display = "inline";
            document.getElementById("submitBtn").disabled = true;

            setTimeout(function () {
              const result = Auth.register({
                name,
                email,
                phone: phone ? "+91" + phone : "",
                password: pass,
              });

              if (result.success) {
                window.location.href = "login.html?registered=true";
              } else {
                document.getElementById("submitText").style.display = "inline";
                document.getElementById("submitSpinner").style.display = "none";
                document.getElementById("submitBtn").disabled = false;
                showAlert(
                  '<i class="fas fa-exclamation-circle me-2"></i>' +
                    result.message,
                  "danger",
                );

                if (result.field === "email") {
                  setInvalid("regEmail", "emailError", result.message);
                }
              }
            }, 700);
          });

        // ── Clear validation on input ─────────────────────────────────────────
        [
          "regName",
          "regEmail",
          "regPhone",
          "regPassword",
          "regConfirmPassword",
        ].forEach(function (id) {
          const el = document.getElementById(id);
          if (el) {
            el.addEventListener("input", function () {
              this.classList.remove("is-invalid", "is-valid");
            });
          }
        });

        document
          .getElementById("regTerms")
          .addEventListener("change", function () {
            if (this.checked) {
              document.getElementById("termsError").style.visibility = "hidden";
            }
          });

        // Phone: only allow digits
        document
          .getElementById("regPhone")
          .addEventListener("input", function () {
            this.value = this.value.replace(/\D/g, "").slice(0, 10);
          });
      })();
    </script>
  </body>
</html>
