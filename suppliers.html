<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Suppliers – SmartStock</title>

    <!-- Bootstrap 5 CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <!-- Google Fonts – Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- App Styles -->
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/inventory.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <div class="app-layout">
      <!-- Sidebar -->
      <aside id="sidebar" class="sidebar"></aside>
      <div id="sidebarOverlay" class="sidebar-overlay"></div>

      <!-- Main Content -->
      <div class="main-content">
        <nav id="topNavbar" class="top-navbar"></nav>

        <div class="page-content">
          <!-- Page Header -->
          <div class="page-header">
            <div
              style="
                display: flex;
                justify-content: space-between;
                align-items: center;
                flex-wrap: wrap;
                gap: 0.75rem;
              "
            >
              <div>
                <h1 class="page-title">Suppliers</h1>
                <p class="page-subtitle">Manage your supplier network</p>
              </div>
              <button class="btn-primary" onclick="openAddSupplierModal()">
                <i class="fas fa-plus me-2"></i>Add Supplier
              </button>
            </div>
          </div>

          <!-- Search / Filter Bar -->
          <div class="filters-bar">
            <div style="position: relative">
              <i
                class="fas fa-search"
                style="
                  position: absolute;
                  left: 12px;
                  top: 50%;
                  transform: translateY(-50%);
                  color: #94a3b8;
                  pointer-events: none;
                "
              ></i>
              <input
                type="text"
                id="searchSuppliers"
                class="form-control"
                placeholder="Search suppliers…"
                style="padding-left: 36px; min-width: 250px"
                oninput="filterSuppliers()"
              />
            </div>

            <select
              id="filterSupplierStatus"
              class="form-select"
              style="max-width: 160px"
              onchange="filterSuppliers()"
            >
              <option value="">All Status</option>
              <option value="Active">Active</option>
              <option value="Inactive">Inactive</option>
            </select>

            <span
              id="supplierCount"
              style="font-size: 0.875rem; color: #64748b; white-space: nowrap"
            ></span>
          </div>

          <!-- Supplier Cards Grid -->
          <div
            id="suppliersGrid"
            style="
              display: grid;
              grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
              gap: 1rem;
            "
          ></div>

          <!-- Empty State -->
          <div
            id="suppliersEmptyState"
            class="empty-state"
            style="display: none"
          >
            <i class="fas fa-truck"></i>
            <h5>No suppliers found</h5>
            <p>Add your first supplier to get started.</p>
            <button
              class="btn-primary"
              onclick="openAddSupplierModal()"
              style="
                margin-top: 1rem;
                padding: 8px 20px;
                border-radius: 8px;
                border: none;
                cursor: pointer;
              "
            >
              Add Supplier
            </button>
          </div>
        </div>
        <!-- /page-content -->
      </div>
      <!-- /main-content -->
    </div>
    <!-- /app-layout -->

    <!-- ============================================================
     ADD / EDIT SUPPLIER MODAL
     ============================================================ -->
    <div id="supplierModal" class="modal-overlay" style="display: none">
      <div class="modal" style="max-width: 580px; width: 95%">
        <div class="modal-header">
          <h5 id="supplierModalTitle">Add Supplier</h5>
          <button
            onclick="closeSupplierModal()"
            style="
              background: none;
              border: none;
              font-size: 1.2rem;
              cursor: pointer;
              color: #64748b;
            "
            aria-label="Close"
          >
            <i class="fas fa-times"></i>
          </button>
        </div>

        <div class="modal-body">
          <input type="hidden" id="sm_id" />
          <div class="row g-3">
            <!-- Supplier Name -->
            <div class="col-md-6">
              <div class="form-group">
                <label class="form-label"
                  >Supplier Name <span class="text-danger">*</span></label
                >
                <input
                  type="text"
                  id="sm_name"
                  class="form-control"
                  placeholder="Company name"
                />
                <div class="invalid-feedback" id="sm_name_err"></div>
              </div>
            </div>
            <!-- Contact Person -->
            <div class="col-md-6">
              <div class="form-group">
                <label class="form-label"
                  >Contact Person <span class="text-danger">*</span></label
                >
                <input
                  type="text"
                  id="sm_contactPerson"
                  class="form-control"
                  placeholder="Contact name"
                />
                <div class="invalid-feedback" id="sm_cp_err"></div>
              </div>
            </div>
            <!-- Email -->
            <div class="col-md-6">
              <div class="form-group">
                <label class="form-label"
                  >Email <span class="text-danger">*</span></label
                >
                <input
                  type="email"
                  id="sm_email"
                  class="form-control"
                  placeholder="email@company.com"
                />
                <div class="invalid-feedback" id="sm_email_err"></div>
              </div>
            </div>
            <!-- Phone -->
            <div class="col-md-6">
              <div class="form-group">
                <label class="form-label"
                  >Phone <span class="text-danger">*</span></label
                >
                <input
                  type="text"
                  id="sm_phone"
                  class="form-control"
                  placeholder="+91 XXXXX XXXXX"
                />
                <div class="invalid-feedback" id="sm_phone_err"></div>
              </div>
            </div>
            <!-- Address -->
            <div class="col-12">
              <div class="form-group">
                <label class="form-label">Address</label>
                <textarea
                  id="sm_address"
                  class="form-control"
                  rows="2"
                  placeholder="Full address"
                ></textarea>
              </div>
            </div>
            <!-- Status -->
            <div class="col-md-6">
              <div class="form-group">
                <label class="form-label">Status</label>
                <select id="sm_status" class="form-select">
                  <option value="Active">Active</option>
                  <option value="Inactive">Inactive</option>
                </select>
              </div>
            </div>
          </div>
        </div>
        <!-- /modal-body -->

        <div class="modal-footer">
          <button
            onclick="closeSupplierModal()"
            style="
              padding: 8px 16px;
              border-radius: 8px;
              border: 1px solid #e2e8f0;
              background: white;
              cursor: pointer;
              font-weight: 500;
              color: #475569;
            "
          >
            Cancel
          </button>
          <button
            onclick="saveSupplier()"
            class="btn-primary"
            style="
              padding: 8px 16px;
              border-radius: 8px;
              border: none;
              cursor: pointer;
              font-weight: 500;
            "
          >
            Save Supplier
          </button>
        </div>
      </div>
    </div>

    <!-- ============================================================
     DELETE CONFIRMATION MODAL
     ============================================================ -->
    <div id="deleteSupplierModal" class="modal-overlay" style="display: none">
      <div class="modal" style="max-width: 400px; width: 95%">
        <div class="modal-header">
          <h5>Delete Supplier</h5>
          <button
            onclick="closeDeleteSupplierModal()"
            style="
              background: none;
              border: none;
              font-size: 1.2rem;
              cursor: pointer;
              color: #64748b;
            "
            aria-label="Close"
          >
            <i class="fas fa-times"></i>
          </button>
        </div>
        <div class="modal-body">
          <div style="text-align: center; padding: 1rem">
            <i
              class="fas fa-trash-alt"
              style="
                font-size: 3rem;
                color: #ef4444;
                margin-bottom: 1rem;
                display: block;
              "
            ></i>
            <p>
              Are you sure you want to delete
              <strong id="deleteSupplierName"></strong>?
            </p>
            <p style="color: #64748b; font-size: 0.875rem">
              This action cannot be undone.
            </p>
          </div>
        </div>
        <div class="modal-footer">
          <button
            onclick="closeDeleteSupplierModal()"
            style="
              padding: 8px 16px;
              border-radius: 8px;
              border: 1px solid #e2e8f0;
              background: white;
              cursor: pointer;
              font-weight: 500;
              color: #475569;
            "
          >
            Cancel
          </button>
          <button
            onclick="confirmDeleteSupplier()"
            style="
              padding: 8px 16px;
              border-radius: 8px;
              border: none;
              cursor: pointer;
              font-weight: 500;
              background: #ef4444;
              color: white;
            "
          >
            Delete
          </button>
        </div>
      </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/suppliers.js"></script>
  </body>
</html>
